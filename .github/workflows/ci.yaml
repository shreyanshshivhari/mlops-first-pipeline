# GITHUB ACTIONS WORKFLOW
# Github automatically look for workflow file inside .github/workflows directory.

# Give workflow a meaningful name
name: Iris ML API - CI PIPELINE

# Define when github should run this workflow
on:
  # Run CI whenever code is pushed to the main branch.
  push:
    branches:
      - main
  
  # Also validate proposed change before they are merged
  pull_request:
    branches:
      - main

# Permission are restricted to reading repo content only.
permissions:
  contents: read
  packages: write

# Define the jobs that make up the pipeline.
jobs:
#JOB 1
  test-and-build:
    # Github provides a fresh ubuntu virtual machine to run the job.
    runs-on: ubuntu-latest


    # Steps
    steps:
      # Step1 : Downlaod the repo content to the runner.
      - name: Check out repository
        uses: actions/checkout@v4

      # Step2 : Set up python environment on runner.
      - name: Install python on runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Step3 : Install dependencies needed to run the tests.
      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step4 : Run the automated tests.
      - name: Run automated tests
        run: python -m pytest -v
    #JOB 2
    build:
      name : Build and publish Docker Image
      needs: test

      runss-on: ubuntu-latest 

      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      steps:
        - name: Check out repository
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v2

        - name: Login to GHCR
          uses: docker/login-action@v2
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Generate Docker metadata
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ghcr.io/${{ github.repository }}/iris-ml-api
            tags: |
              type=raw, value=latest
              type=sha, format=short

          #Build the docker and push it to GHCR (Github Container Registry)
        - name: Build and push Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            tags: ${{ steps.meta.outputs.tags }}


        